name: RookieLab
options:
  bundleIdPrefix: io.rookielab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L756RGRFW2
    CODE_SIGN_STYLE: Automatic
    # 主程式的 Bundle ID；分享延伸是它加上 .share。個人測試機用 BUNDLE_BASE=io.rookielab.app.dev 覆寫
    BUNDLE_BASE: io.rookielab.app
packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    exactVersion: 0.17.0
  # 本地複製一份（ios/Packages/chesskit-engine，MIT）：原版編譯 Stockfish 時沒開 NEON，NNUE 慢好幾倍
  ChessKitEngine:
    path: Packages/chesskit-engine
  # 當機紀錄（Crashlytics，Apache 2.0）。不用 Analytics：閉源，跟 GPL 的 Stockfish 不能一起發布；使用統計改送自己的 /api/events（見 Services/Telemetry.swift）
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.0
targets:
  RookieLab:
    type: application
    platform: iOS
    sources:
      - path: RookieLab
    dependencies:
      - package: ChessKit
      - package: ChessKitEngine
      - package: Firebase
        product: FirebaseCrashlytics
      - target: RookieLabShare
    # Stockfish 評估檔打包進 App（約 78MB），第一次打開不用再下載
    postCompileScripts:
      - name: Bundle NNUE
        script: "\"$SRCROOT/fetch-nnue.sh\""
        basedOnDependencyAnalysis: false
    # 當機紀錄要符號檔才看得懂：有 Firebase 設定檔時，編譯完自動上傳 dSYM
    postBuildScripts:
      - name: Crashlytics dSYM
        script: |
          if ls "$SRCROOT/RookieLab/Firebase/"GoogleService-Info*.plist >/dev/null 2>&1; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    info:
      path: RookieLab/Info.plist
      properties:
        CFBundleDisplayName: Rookie Lab
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.rookielab.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: io.rookielab.app
            CFBundleURLSchemes: [rookielab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 標誌候選 A、B：「我的」頁可以換圖示（scripts/render-icon-options.tsx 產生）
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconA IconB"
        # 第一版只上 iPhone（iPad 要另外的截圖與審核）
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  # 分享延伸：在 Chess.com、Lichess 的對局按分享 → Rookie Lab，把對局連結交給主程式
  RookieLabShare:
    type: app-extension
    platform: iOS
    sources: [RookieLabShare]
    info:
      path: RookieLabShare/Info.plist
      properties:
        CFBundleDisplayName: Rookie Lab
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE).share
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  RookieLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RookieLabTests]
    dependencies:
      - target: RookieLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.rookielab.app.tests
schemes:
  RookieLab:
    build:
      targets:
        RookieLab: all
        RookieLabTests: [test]
    test:
      targets: [RookieLabTests]
      environmentVariables:
        TEST_ACCOUNT: chesscom:rookielab-io
